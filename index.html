<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Seguridad Vial / Unidades Detenidas</title>

<style>
:root{--bg:#fff4fa;--card:#fff;--tx:#3d1630;--mu:#8e6882;--ln:#f3cddd;--vino:#990052;--osc:#ec168c;--deep:#52002f;--soft:#ffe2f0;--ok:#4d7a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e111d;--card:#301827;--tx:#fff2f8;--mu:#c9a4b8;--ln:#543147;--soft:#48243a;--ok:#7fb48e}}
:root[data-theme=dark]{--bg:#1e111d;--card:#301827;--tx:#fff2f8;--mu:#c9a4b8;--ln:#543147;--soft:#48243a;--ok:#7fb48e}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
header{background:linear-gradient(115deg,var(--deep),var(--vino) 55%,var(--osc));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:4px solid #ffafd5}
.badge{background:none;border-radius:0;width:108px;height:108px;display:grid;place-items:center;flex:none;overflow:visible}.badge img{width:104px;height:104px;border-radius:0;object-fit:contain}
header h1{margin:0;font-size:24px;letter-spacing:.3px}header small{opacity:.8;display:block}
.sp{flex:1}.ebi{height:38px}
.btn{background:#fff;color:var(--vino);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}.btn.g{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
main{max-width:1280px;margin:0 auto;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--osc);border-radius:10px;padding:12px 14px;cursor:pointer}.k b{font-size:28px;color:var(--vino);display:block}.k span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:16px}
.seg{display:flex;border:1px solid var(--vino);border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;color:var(--vino);padding:8px 13px;cursor:pointer;font-weight:600}.seg button.on{background:var(--vino);color:#fff}
input,select{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit}#q{flex:1;min-width:220px;border-color:var(--osc)}
.grid{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:16px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;min-width:0}.card h2{margin:0 0 10px;font-size:14px;color:var(--vino);text-transform:uppercase;letter-spacing:.6px}
.row{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12px}.row:hover,.row.on{background:var(--soft)}.row i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--vino),#ff74bd)}.row em{font-style:normal;text-align:right;font-weight:700}
.tw{overflow-x:auto;max-height:560px;overflow-y:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}th{position:sticky;top:0;background:var(--vino);color:#fff;text-align:left;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--ln)}tr.r{cursor:pointer}tr.r:hover{background:var(--soft)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--osc);font-size:11px;font-weight:700;white-space:nowrap}.tag.l{background:#dfeee4;color:#2f6a45}.tag.x{background:var(--deep);color:#fff}
#ficha{position:fixed;inset:0;background:rgba(40,8,14,.6);display:none;place-items:center;padding:16px;z-index:50}#ficha.on{display:grid}
.fc{background:var(--card);border-radius:14px;max-width:860px;width:100%;max-height:92vh;overflow:auto;border-top:6px solid var(--osc)}.fh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--soft)}.fh h3{margin:0;color:var(--vino);font-size:20px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:18px 20px}.fg div{border-bottom:1px solid var(--ln);padding-bottom:6px}.fg .w{grid-column:1/-1}.fg label{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
#pers{display:none;background:var(--card);border:1px dashed var(--osc);border-radius:10px;padding:10px 14px;margin-bottom:14px}#pers label{margin-right:16px}
.msg{color:var(--mu);font-size:12px;margin:6px 2px 12px}.hide{display:none!important}

<script>
const SNAP=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm=s=>String(s??'').replace(/^\uFEFF/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const HM={ECO:'eco',ECONOMICO:'eco',GERENCIA:'gerencia',MARCA:'marca',SERIE:'serie',MODELO:'modelo',UBICACION:'ubicacion','FECHA INGRESO':'ingreso','FECHA DE INGRESO':'ingreso','DIAS DETENIDAS':'dias','DIAS DETENIDA':'dias','FECHA LIBERACION':'liberacion',GESTOR:'gestor',ESTATUS:'estatus','ESTATUS ACTUAL':'estatus','OFICIO DE LIBERACION':'oficio',CAUSA:'causa','CAUSA PARA LIBERACION':'causaLib',AUTORIDAD:'autoridad',OBSERVACIONES:'obs',OPERACION:'operacion'};
const GA={'PACIFICO':'PACÍFICO','PACIFICO CENTRO':'PACÍFICO CENTRO','PACIFICO SUR':'PACÍFICO SUR','':'SIN GERENCIA'};
const LB={eco:'Económico',gerencia:'Gerencia',marca:'Marca',serie:'Serie',modelo:'Modelo',ubicacion:'Ubicación',ingreso:'Fecha de ingreso',dias:'Días detenida',liberacion:'Fecha de liberación',gestor:'Gestor',estatus:'Estatus',oficio:'Oficio de liberación',causa:'Causa',causaLib:'Causa para liberación',autoridad:'Autoridad',obs:'Observaciones',operacion:'Operación'};
const WIDE=['causa','causaLib','obs'];
let D=[],S={tab:'Plan',ger:'',est:'',q:'',gest:'',qg:'',weekOnly:false};
const dd=s=>s?new Date(s+'T00:00:00Z'):null,fd=s=>s?s.split('-').reverse().join('/'):'—';
function iso(v){if(typeof v=='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v=='string'&&/^\d{4}-\d\d-\d\d/.test(v))return v.slice(0,10);return v==null||v===''?null:String(v).trim()}
const today=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
function canon(v){const m={},sc=x=>(x.match(/[^\x00-\x7f]/g)||[]).length;v.forEach(x=>{const c=String(x??'').replace(/\s+/g,' ').trim().toUpperCase();if(!c)return;const k=nrm(c);if(!(k in m)||sc(c)>sc(m[k]))m[k]=c});return m}
function prep(list){const gm=canon(list.map(x=>x.gerencia)),em=canon(list.map(x=>x.estatus));if(gm.PACIFICO)gm.PACIFICO='PACÍFICO';D=list.map(d=>{d=Object.assign({},d);d.gerencia=gm[nrm(d.gerencia)]||'SIN GERENCIA';d.estatus=em[nrm(d.estatus)]||'';
 const a=dd(d.ingreso),b=dd(d.liberacion);d.dias=a?Math.round(((d.origen=='Liberadas'?(b?b.getTime():null):today())-a.getTime())/864e5):null;if(d.dias!==null&&isNaN(d.dias))d.dias=null;return d});init()}
function parse(wb){const out=[];const map={PLAN:'Plan',ROBO:'ROBO',LIBERADAS:'Liberadas'};
 for(const n of wb.SheetNames){const o=map[nrm(n)];if(!o)continue;const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
  const hi=rows.findIndex(r=>r.some(c=>['ECO','ECONOMICO'].includes(nrm(c))));if(hi<0)continue;const cols=rows[hi].map(c=>HM[nrm(c)]||null);
  for(const r of rows.slice(hi+1)){const d={origen:o};cols.forEach((k,i)=>{if(k&&!(k in d))d[k]=r[i]});if(d.eco==null||String(d.eco).trim()===''||/^SEMANA/i.test(String(d.eco).trim()))continue;
   ['ingreso','liberacion','oficio'].forEach(k=>d[k]=iso(d[k]));Object.keys(LB).forEach(k=>{if(!['ingreso','liberacion','oficio','dias'].includes(k))d[k]=d[k]==null||d[k]===''?null:String(d[k]).trim()});out.push(d)}}
 return out}
const TABS=[['Plan','Detenidas'],['ROBO','Robo'],['Liberadas','Liberadas'],['*','Todas']];
const src=d=>d.origen=='Plan'?'Detenida':d.origen=='ROBO'?'Robo':'Liberada';
function base(){const q=nrm(S.q);return D.filter(d=>(!S.weekOnly||(d.origen=='Liberadas'&&enSemanaActual(d.liberacion)))&&(q?nrm(d.eco).includes(q):(S.tab=='*'||d.origen==S.tab)))}function filt(skipG){return base().filter(d=>(skipG||!S.ger||d.gerencia==S.ger)&&(!S.est||d.estatus==S.est)&&(!S.gest||d.gestor==S.gest)&&(!S.qg||nrm(d.gestor).includes(nrm(S.qg))))}
function enSemanaActual(s){const d=dd(s);if(!d)return false;const n=new Date(),offset=(n.getDay()+6)%7,inicio=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()-offset),t=d.getTime();return t>=inicio&&t<inicio+7*864e5}
function render(){const q=S.q.trim(),L=filt(),B=filt(true);
 $('seg').innerHTML=TABS.map(([k,t])=>`<button class="${!q&&S.tab==k?'on':''}" data-k="${k}">${t}</button>`).join('');
 const P=D.filter(d=>d.origen=='Plan'),av=a=>a.length?Math.round(a.reduce((s,d)=>s+(d.dias||0),0)/a.length):0,salidasSemana=D.filter(d=>d.origen=='Liberadas'&&enSemanaActual(d.liberacion)).length;
 $('kpis').innerHTML=[['Plan','Unidades detenidas',P.length],['ROBO','Robo',D.filter(d=>d.origen=='ROBO').length],['Liberadas','Liberadas',D.filter(d=>d.origen=='Liberadas').length],['','Promedio días (detenidas)',av(P)],['','Más de 90 días',P.filter(d=>d.dias>90).length],['Semana','LIBERADAS ESTA SEMANA',salidasSemana]].map(([k,t,v])=>`<div class="k" data-k="${k}"><b>${v}</b><span>${t}</span></div>`).join('');
 const g={};B.forEach(d=>g[d.gerencia]=(g[d.gerencia]||0)+1);const e=Object.entries(g).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...e.map(x=>x[1]));
 $('bars').innerHTML=e.map(([n,c])=>`<div class="row ${S.ger==n?'on':''}" data-g="${esc(n)}"><span>${esc(n)}</span><i style="width:${c/mx*100}%"></i><em>${c}</em></div>`).join('')||'<div class="msg">Sin datos</div>';
 L.sort((a,b)=>(b.dias??-1)-(a.dias??-1));
 $('lt').textContent='Listado · '+L.length+' unidad'+(L.length==1?'':'es');
 $('msg').textContent=q?'Búsqueda "'+q+'" en todas las bases (detenidas, robo y liberadas).':S.weekOnly?'Unidades liberadas durante la semana actual.':'';
 $('tb').innerHTML=L.map((d,i)=>`<tr class="r" data-i="${D.indexOf(d)}"><td><b>${esc(d.eco)}</b></td><td>${esc(d.gerencia)}</td><td>${esc(d.marca)}</td><td>${esc(d.ubicacion)}</td><td>${fd(d.ingreso)}</td><td>${d.dias??'—'}</td><td><span class="tag ${d.origen=='Liberadas'?'l':d.origen=='ROBO'?'x':''}">${esc(d.estatus||src(d))}</span></td><td>${esc(d.gestor)}</td></tr>`).join('')||'<tr><td colspan="8" class="msg">Sin resultados</td></tr>';
 if(q&&L.length==1&&S._last!=q){S._last=q;open(D.indexOf(L[0]))}if(!q)S._last=''}
function open(i){const d=D[i];$('ft').textContent='Unidad '+d.eco+' · '+src(d);
 $('fb').innerHTML=Object.keys(LB).map(k=>{let v=d[k];if(k=='ingreso'||k=='liberacion')v=fd(v);else if(k=='oficio'&&/^\d{4}-\d\d-\d\d/.test(v||''))v=fd(v);return `<div class="${WIDE.includes(k)?'w':''}"><label>${LB[k]}</label>${esc(v==null||v===''?'—':v)}</div>`}).join('');$('ficha').classList.add('on')}
function init(){const es=[...new Set(D.map(d=>d.estatus).filter(Boolean))].sort(),gs=[...new Set(D.map(d=>d.gerencia))].sort(),gests=[...new Set(D.map(d=>d.gestor).filter(Boolean))].sort();
 $('fg').innerHTML='<option value="">Todas las gerencias</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');$('fe').innerHTML='<option value="">Todos los estatus</option>'+es.map(x=>`<option>${esc(x)}</option>`).join('');$('fgs').innerHTML='<option value="">Todos los gestores</option>'+gests.map(x=>`<option>${esc(x)}</option>`).join('');
 if(!gs.includes(S.ger))S.ger='';if(!es.includes(S.est))S.est='';if(!gests.includes(S.gest))S.gest='';$('fg').value=S.ger;$('fe').value=S.est;$('fgs').value=S.gest;$('qg').value=S.qg;render()}$('seg').onclick=e=>{if(e.target.dataset.k){S.tab=e.target.dataset.k;S.weekOnly=false;S.q='';$('q').value='';render()}};
$('kpis').onclick=e=>{const k=e.target.closest('.k')?.dataset.k;if(!k)return;if(k==='Semana'){S.tab='Liberadas';S.weekOnly=!S.weekOnly}else{S.tab=k;S.weekOnly=false}S.q='';$('q').value='';render()};$('bars').onclick=e=>{const g=e.target.closest('.row')?.dataset.g;if(g!==undefined){S.ger=S.ger==g?'':g;$('fg').value=S.ger;render()}};
