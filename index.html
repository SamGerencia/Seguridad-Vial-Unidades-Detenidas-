<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Seguridad Vial / Unidades Detenidas</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root{--bg:#f7f1f0;--card:#fff;--tx:#2b1215;--mu:#7a5a5e;--ln:#ead9da;--vino:#6b1426;--osc:#8f1d24;--deep:#3d0c15;--soft:#f3dcdd;--ok:#4d7a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c0d10;--card:#2a1418;--tx:#f6e9ea;--mu:#c7a4a8;--ln:#4a2a30;--soft:#3d1e24;--ok:#7fb48e}}
        :root[data-theme=dark]{--bg:#1c0d10;--card:#2a1418;--tx:#f6e9ea;--mu:#c7a4a8;--ln:#4a2a30;--soft:#3d1e24;--ok:#7fb48e}
        html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
        header{background:linear-gradient(115deg,var(--deep),var(--vino) 55%,var(--osc));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:4px solid #d9a5a8}
        .badge{background:#fff;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;flex:none}.badge img{width:62px;height:62px;border-radius:50%}
        header h1{margin:0;font-size:24px;letter-spacing:.3px}header small{opacity:.8;display:block}
        .sp{flex:1}
        .btn{background:#fff;color:var(--vino);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}.btn.g{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
        main{max-width:1280px;margin:0 auto;padding:18px}
        .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
        .k"{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--osc);border-radius:10px;padding:12px 14px;cursor:pointer}.k b{font-size:28px;color:var(--vino);display:block}.k span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
        .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:16px}
        .seg{display:flex;border:1px solid var(--vino);border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;color:var(--vino);padding:8px 13px;cursor:pointer;font-weight:600}.seg button.on{background:var(--vino);color:#fff}
        input,select{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit}#q{flex:1;min-width:220px;border-color:var(--osc)}
        .grid{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:16px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
        .card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;min-width:0}.card h2{margin:0 0 10px;font-size:14px;color:var(--vino);text-transform:uppercase;letter-spacing:.6px}
        .row{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12px}.row:hover,.row.on{background:var(--soft)}.row i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--vino),#c25a60)}.row em{font-style:normal;text-align:right;font-weight:700}
        .tw{overflow-x:auto;max-height:560px;overflow-y:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}th{position:sticky;top:0;background:var(--vino);color:#fff;text-align:left;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--ln)}tr.r{cursor:pointer}tr.r:hover{background:var(--soft)}
        .tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--osc);font-size:11px;font-weight:700;white-space:nowrap}.tag.l{background:#dfeee4;color:#2f6a45}.tag.x{background:var(--deep);color:#fff}
        #ficha{position:fixed;inset:0;background:rgba(40,8,14,.6);display:none;place-items:center;padding:16px;z-index:50}#ficha.on{display:grid}
        .fc{background:var(--card);border-radius:14px;max-width:860px;width:100%;max-height:92vh;overflow:auto;border-top:6px solid var(--osc)}.fh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--soft)}.fh h3{margin:0;color:var(--vino);font-size:20px}
        .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:18px 20px}.fg div{border-bottom:1px solid var(--ln);padding-bottom:6px}.fg .w{grid-column:1/-1}.fg label{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
        #pers{display:none;background:var(--card);border:1px dashed var(--osc);border-radius:10px;padding:10px 14px;margin-bottom:14px}#pers label{margin-right:16px}
        .msg{color:var(--mu);font-size:12px;margin:6px 2px 12px}.hide{display:none!important}
    </style>
</head>
<body>
    <header>
        <div class="badge"><img src="https://grupoestrellablanca.com" alt="GEB" onerror="this.parentElement.style.display='none'"></div>
        <div><h1>Seguridad Vial / Unidades Detenidas</h1><small>Grupo Estrella Blanca</small></div>
        <div class="sp"></div>
        <button class="btn g" onclick="descargarExcelDeLaNube()">🔄 Actualizar datos</button>
    </header>
    <main>
        <div class="kpis" id="kpis"></div>
        <div class="bar">
            <input type="search" id="q" placeholder="Buscar por Unidad, Empresa, Delegación, Motivo, Estado...">
            <div class="seg" id="seg"></div>
            <button class="btn" id="clean" title="Limpiar Filtros">Limpiar</button>
        </div>
        <div id="pers"></div>
        <div class="grid">
            <div class="card"><h2 id="lt">Delegaciones</h2><div id="list" class="tw"></div></div>
            <div class="card"><h2>Registros</h2><div class="tw"><table id="table"></table></div></div>
        </div>
    </main>
    <div id="ficha"><div class="fc" id="fc"></div></div>

    <script>
        // Pega aquí tu nuevo enlace de Google Sheets que termina en pub?output=xlsx
        const URL_DE_TU_EXCEL = "https://google.com";

        let BD = [], F = { q: '', seg: '', grp: '' }, GRP = 'Delegación';

        window.onload = function() {
            descargarExcelDeLaNube();
        };

        function descargarExcelDeLaNube() {
            fetch(URL_DE_TU_EXCEL)
                .then(response => {
                    if (!response.ok) throw new Error("Error en la conexión de red.");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    const data = new Uint8Array(buffer);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Buscamos explícitamente la hoja llamada "PLAN" en todo el libro de Excel
                    let worksheet = workbook.Sheets["PLAN"];
                    
                    // Si por alguna razón cambió el nombre, tomamos la segunda pestaña automáticamente
                    if (!worksheet) {
                        worksheet = workbook.Sheets[workbook.SheetNames[1]];
                    }
                    
                    const datosConvertidos = XLSX.utils.sheet_to_json(worksheet);
                    cargarDatos(datosConvertidos);
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Error de sincronización con Google Sheets. Verifica que esté publicado como Excel (.xlsx)");
                });
        }

        function cargarDatos(data) {
            BD = data;
            init();
        }

        function init() {
            let segs = [...new Set(BD.map(r => r.Segmento).filter(Boolean))].sort();
            let html = `<button class="on" data-v="">Todos</button>`;
            segs.forEach(s => html += `<button data-v="${s}">${s}</button>`);
            document.getElementById('seg').innerHTML = html;

            document.querySelectorAll('.seg button').forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
                    b.classList.add('on');
                    F.seg = b.dataset.v;
                    render();
                };
            });

            document.getElementById('q').oninput = (e) => { F.q = e.target.value.toLowerCase(); render(); };
            document.getElementById('clean').onclick = () => {
                document.getElementById('q').value = '';
                document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
                document.querySelector('.seg button').classList.add('on');
                F = { q: '', seg: '', grp: '' };
                render();
            };

            document.getElementById('ficha').onclick = (e) => { if (e.target.id === 'ficha') e.target.classList.remove('on'); };
            render();
        }

        function render() {
            let res = BD.filter(r => {
                if (F.seg && r.Segmento !== F.seg) return false;
                if (F.q) {
                    let match = false;
                    for (let k in r) { if (String(r[k]).toLowerCase().includes(F.q)) match = true; }
                    if (!match) return false;
                }
                return true;
            });

            let kpis = { t: res.length, d: 0, l: 0 };
            res.forEach(r => { if (String(r.Estado).toLowerCase().includes('liberada')) kpis.l++; else kpis.d++; });
